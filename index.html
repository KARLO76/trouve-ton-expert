 no:{t:"Notaire d'affaires",d:'Transmission, actes, immobilier',i:'Stamp',badge:'Office notarial vérifié',reg:"Numéro de l'office (CRPCEN)",kw:/notaire|donation|succession|transm|sci|mariage|immobilier/,next:['cgp'],

 ma:{t:'Conseil M&A (Cession / Acquisition)',d:'Vendre, racheter, valoriser',i:'Handshake',badge:'Société vérifiée',reg:'',kw:/vend|c[ée]der|cession|rachat|racheter|acqu|lev[ée]e|valoris/,next:['av','no','cgp','bp'],

const MINA=['Aucun minimum','50 k€','250 k€','1 M€'],BUDGET=['Moins de 150 €/mois','150 à 400 €/mois','Plus de 400 €/mois','À discuter'],RADIUS=['5 km','20 km','50 km','Toute la France'],KM=[5,20,50,2000];
const CITIES={Paris:[48.8566,2.3522],Lyon:[45.764,4.8357],Marseille:[43.2965,5.3698],Bordeaux:[44.8378,-.5792],Lille:[50.6292,3.0573],Nantes:[47.2184,-1.5536],Nice:[43.7102,7.262],Toulouse:[43.6047,1.4442],Strasbourg:[48.5734,7.7521],Rennes:[48.1173,-1.6778]};

const dist=(a,b)=>{if(!a?.lat||!b?.lat)return null;const r=Math.PI/180,x=Math.sin((b.lat-a.lat)*r/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin((b.lon-a.lon)*r/2)**2;return 12742*Math.asin(Math.sqrt(x))};

/* ---------- Étapes : chaque question déjà connue du profil est sautée ---------- */
const multi=(k,q,o,x={})=>({type:'multi',k,q,o,...x}), single=(k,q,o,x={})=>({type:'single',k,q,o,...x}), form=(k,q,f,x={})=>({type:'form',k,q,f,...x});

 if(st.includes('Holding')||big)r.add('av');if(st.includes('SCI'))r.add('no');if(big)r.add('cgp').add('bp');if(SAL.indexOf(a.sal)>0)r.add('ec');if(st.includes('Profession libérale'))r.add('cgp');

 const m={ec:[birth&&0,hasBiz(a)&&1,emp&&3,st.some(x=>['SAS','SASU','SARL','EURL'].includes(x))&&4,big&&5,arr(a.sector).includes('E-commerce')&&6],cgp:[fam&&0,st.includes('Profession libérale')&&3,big&&2,sell&&4,st.includes('SCI')&&5],av:[sell&&0,(st.includes('Holding')||big)&&1,fam&&3,birth&&4],no:[fam&&0,st.includes('SCI')&&1,sell&&2,birth&&4],ma:[sell&&0,sell&&3,fam&&sell&&4,big&&2],bp:[big&&0,birth&&1,sell&&2,big&&3,fam&&4]}[j];
 return m.filter(x=>x!==false).map(i=>k[i]);

const lead=(o,r)=>[...o.filter(x=>r.includes(x)),...o.filter(x=>!r.includes(x))];

const lastAnswers=c=>{const o={};DB.searches.filter(x=>x.cid===c.id).sort((m,n)=>m.at-n.at).forEach(x=>KEEP.forEach(k=>{if(filled(x.a[k]))o[k]=x.a[k]}));return o};
const clientSteps=(a,known={})=>allSteps(a,known).filter(x=>!(KEEP.includes(x.k)&&filled(known[x.k])));

  ...(hasBiz(full)&&!filled(known.statut)?[form('company','Retrouvez votre société',[{k:'siret',t:'SIRET ou SIREN (facultatif)',siret:'client'}],{help:'Toutes les questions suivantes seront préremplies : passez, ou modifiez si besoin.'})]:[]),
  ...P.filter(p=>!late.includes(p.k)),
  multi('jobs','De quels professionnels avez-vous besoin ?',lead(jobOpts,rj),{jobs:true,reco:rj,help:'Les recommandations viennent de vos réponses. Choisissez-en autant que nécessaire.'}),
  ...js.map(j=>{const r=recoNeeds(j,full);return multi('n_'+j,'Vos besoins',lead(JOBS[j].sk,r),{tag:j,reco:r,help:'Plusieurs réponses. La première choisie compte davantage.'})}),
  ...(js.some(j=>'cgp bp'.includes(j))?[single('montant','Quel montant est concerné ?',MONTANT)]:[]),
  ...(js.some(j=>'av no ma'.includes(j))?[single('valeur','Quelle est la valeur estimée de la société ou du bien ?',VALEUR)]:[]),
  ...(js.includes('ec')?[single('budget','Quel budget pour votre comptabilité ?',BUDGET)]:[]),
  single('delai','Quand voulez-vous avancer ?',DELAI),
  ...P.filter(p=>late.includes(p.k)),
  form('note','Voulez-vous ajouter un détail ?',[{k:'note',t:'Votre projet en quelques mots (facultatif)',area:true}])];
}
function proSteps(a){
 const js=arr(a.jobs),biz=hasBiz(a),rs=arr(a.recoJobs);
 return [form('id','Présentez votre entreprise',[{k:'siret',t:'SIRET ou SIREN',siret:'pro'},{k:'name',t:'Nom du cabinet',v:v=>!(v||'').trim()&&'Indiquez le nom du cabinet.'},{k:'place',t:'Adresse du cabinet',place:true,v:needPlace}]),
  multi('jobs','Quels métiers exercez-vous ?',lead(jobOpts,rs),{jobs:true,reco:rs,help:'Chaque métier réglementé sera vérifié séparément.'}),
  ...js.flatMap(j=>[multi('s_'+j,'Que proposez-vous ?',JOBS[j].sk,{tag:j}),
   {type:'rank',k:'t_'+j,q:'Sur quoi êtes-vous le plus fort ?',o:arr(a['s_'+j]),max:3,tag:j,help:"Cliquez dans l'ordre : votre plus grand point fort d'abord, jusqu'à 3."}]),
  multi('scope','Pour quels projets êtes-vous à l\'aise ?',SCOPE),

  ...(js.some(j=>'cgp bp'.includes(j))?[single('minA','À partir de quel montant acceptez-vous un dossier ?',MINA)]:[]),
  ...(js.some(j=>'av no ma'.includes(j))?[multi('vals','Quelles valeurs de dossiers traitez-vous ?',VALEUR.slice(0,3))]:[]),
  ...(js.includes('ec')?[multi('fees','Quels budgets de comptabilité acceptez-vous ?',BUDGET.slice(0,3))]:[]),

  ...(arr(a.mode).some(m=>m!==MODE[0])?[single('radius',"Jusqu'à quelle distance recevez-vous ou vous déplacez-vous ?",RADIUS)]:[]),
  multi('lang','Dans quelles langues ?',LANG),
  single('avail','Quand pouvez-vous recevoir un nouveau client ?',AVAIL),
  single('cap','Combien de nouveaux clients par mois ?',['2','5','10','20']),
  form('proof','Vos justificatifs et votre présentation',[...js.filter(j=>JOBS[j].reg).map(j=>({k:'r_'+j,t:JOBS[j].reg,v:v=>!(v||'').trim()&&'Remplissez chaque numéro professionnel.'})),{k:'about',t:'Présentation courte (facultatif)',area:true}])];
}
const orAll=(v,all)=>filled(v)?v:all;
const toPro=a=>({name:(a.name||'').trim(),siret:a.siret||'',place:a.place,city:a.place?.city||'',jobs:arr(a.jobs),skills:Object.fromEntries(arr(a.jobs).map(j=>[j,arr(a['s_'+j])])),top:Object.fromEntries(arr(a.jobs).map(j=>[j,arr(a['t_'+j]).filter(x=>arr(a['s_'+j]).includes(x))])),scope:orAll(a.scope,SCOPE),sector:orAll(a.sector,SECTOR),statuts:orAll(a.statuts,STATUT),sizes:orAll(a.sizes,CA),sals:orAll(a.sals,SAL),minA:a.minA||MINA[0],vals:orAll(a.vals,VALEUR),fees:orAll(a.fees,BUDGET),prio:arr(a.prio),mode:orAll(a.mode,MODE),radius:a.radius||RADIUS[3],lang:orAll(a.lang,LANG),avail:a.avail||AVAIL[0],cap:+(a.cap||5),about:a.about||'',reg:Object.fromEntries(arr(a.jobs).map(j=>[j,a['r_'+j]||'']))});
const fromPro=p=>({...p,cap:String(p.cap),...Object.fromEntries(p.jobs.flatMap(j=>[['s_'+j,p.skills[j]],['t_'+j,p.top[j]],['r_'+j,p.reg?.[j]||'']]))});

/* ---------- Correspondance : base 40 / 30 / 20 / 10, ajustée par les priorités, le délai et le mode d'échange ---------- */
const activeCount=(db,p)=>db.reqs.filter(r=>r.pid===p.id&&['accepted','proposal','signed'].includes(r.status)&&Date.now()-r.at<30*24*H).length;
const inter=(x,y)=>arr(x).filter(v=>arr(y).includes(v));
function weights(a){
 const pr=arr(a.prio),w={need:40,spec:30,loc:20,dispo:10,meth:0};
 if(pr.includes('Expérience de mon secteur'))w.spec+=15;if(pr.includes('Proximité'))w.loc+=20;if(pr.includes('Réactivité'))w.dispo+=15;
 w.meth=10*pr.filter(x=>['Pédagogie','Prix clair','Outils en ligne','Suivi régulier'].includes(x)).length;
 if(a.delai===DELAI[0])w.dispo+=15;if(a.delai===DELAI[3])w.dispo=2;
 if(filled(a.mode)&&arr(a.mode).every(m=>m===MODE[0]))w.loc=0;
 const t=Object.values(w).reduce((x,y)=>x+y);Object.keys(w).forEach(k=>w[k]=w[k]/t*100);return w;
}
function scorePro(p,job,a){
 const needs=arr(a['n_'+job]),sk=p.skills[job]||[],top=p.top[job]||[],nw=i=>i===0?1.5:1;
 const one=n=>top.includes(n)?1-.05*top.indexOf(n):sk.includes(n)?.65:0;
 const cov=needs.reduce((t,n,i)=>t+one(n)*nw(i),0)/Math.max(1,needs.reduce((t,_,i)=>t+nw(i),0));
 const perso=isPerso(a),biz=hasBiz(a),sec=inter(a.sector,p.sector),sp=[];
 const add=(v,r,w=1)=>filled(v)&&sp.push([r,w]);
 if(!perso)add(a.sector,sec.length/Math.max(1,arr(a.sector).length),3);
 add(a.statut,inter(a.statut,p.statuts).length/Math.max(1,arr(a.statut).length),1.5);
 add(a.scope,inter(a.scope,p.scope).length/Math.max(1,arr(a.scope).length),1.5);
 if(biz){add(a.ca,p.sizes.includes(a.ca)?1:0,2);add(a.sal,p.sals.includes(a.sal)?1:0,1)}
 if('av no ma'.includes(job)&&a.valeur!==VALEUR[3])add(a.valeur,p.vals.includes(a.valeur)?1:0,3);
 if(job==='ec'&&a.budget!==BUDGET[3])add(a.budget,p.fees.includes(a.budget)?1:0,2);
 const mi=MONTANT.indexOf(a.montant),min=MINA.indexOf(p.minA);
 if('cgp bp'.includes(job)&&mi>=0&&mi<4)add(a.montant,mi-min>2?.6:1,2);
 const spec=sp.length?sp.reduce((t,[r,w])=>t+r*w,0)/sp.reduce((t,[,w])=>t+w,0):.5;
 const d=dist(a.place,p.place),cm=orAll(a.mode,MODE),modes=inter(cm,p.mode),visio=modes.includes(MODE[0]),site=modes.some(m=>m!==MODE[0]);
 const lim=Math.min(KM[RADIUS.indexOf(a.radius||RADIUS[3])],KM[RADIUS.indexOf(p.radius)]),reach=site&&(d==null||d<=lim);
 const loc=d==null?.5:d<=2?1:d<=10?.9:d<=30?.7:d<=80?.4:visio?.3:.1;
 const ai=AVAIL.indexOf(p.avail),dispo=({[DELAI[0]]:[1,.35,0],[DELAI[1]]:[1,.9,.5],[DELAI[2]]:[1,1,.9]}[a.delai]||[1,.9,.8])[ai];
 const soft=arr(a.prio).filter(x=>['Pédagogie','Prix clair','Outils en ligne','Suivi régulier'].includes(x)),good=inter(a.prio,p.prio),meth=soft.length?inter(soft,p.prio).length/soft.length:0;
 const w=weights(a),raw=[['Besoin',cov,w.need],['Profil',spec,w.spec],['Distance',loc,w.loc],['Délai',dispo,w.dispo],['Méthode',meth,w.meth]].filter(x=>x[2]>0);
 const parts=raw.map(([t,r,x])=>[t,Math.round(r*x),Math.round(x)]),pts=Math.round(raw.reduce((t,[,r,x])=>t+r*x,0));
 const out=[cov===0&&'ne couvre aucun de vos besoins',filled(a.lang)&&!inter(a.lang,p.lang).length&&'ne parle pas vos langues',!visio&&!reach&&'trop loin ou mode d\'échange différent','cgp bp'.includes(job)&&mi>=0&&mi<4&&mi<min&&'demande au moins '+p.minA].filter(Boolean);
 const best=needs.filter(n=>top.includes(n)),miss=needs.filter(n=>!sk.includes(n));
 const why=[best.length&&'Point fort : '+best.join(', '),!best.length&&cov>0&&'Couvre : '+needs.filter(n=>sk.includes(n)).join(', '),!perso&&sec.length&&'Connaît : '+sec.join(', '),d!=null&&reach&&'À '+kmTxt(d)+' de vous (à vol d\'oiseau)',visio&&!reach&&'Échange en visio',good.length&&'Apprécié pour : '+good.join(', '),'Disponible : '+p.avail.toLowerCase()].filter(Boolean);
 const warn=[miss.length&&'Ne propose pas : '+miss.join(', '),biz&&a.ca&&!p.sizes.includes(a.ca)&&'Taille de société inhabituelle pour ce cabinet',filled(a.statut)&&!inter(a.statut,p.statuts).length&&'Accompagne rarement votre statut',job==='ec'&&a.budget&&a.budget!==BUDGET[3]&&!p.fees.includes(a.budget)&&'Budget habituel différent','av no ma'.includes(job)&&a.valeur&&a.valeur!==VALEUR[3]&&!p.vals.includes(a.valeur)&&'Taille de dossier inhabituelle'].filter(Boolean);
 return {p,job,parts,why,warn,out,cov,d,pts};
}
const ready=(db,job)=>db.pros.filter(p=>p.ok&&p.open&&p.jobs.includes(job)&&activeCount(db,p)<p.cap);
const matches=(db,job,a)=>ready(db,job).map(p=>scorePro(p,job,a)).filter(m=>!m.out.length).sort((x,y)=>y.pts-x.pts).slice(0,3);
const blocked=(db,job,a)=>[...new Set(ready(db,job).flatMap(p=>scorePro(p,job,a).out))];
const opps=(db,p)=>db.searches.filter(x=>Date.now()-x.at<60*24*H).flatMap(x=>{const c=db.clients.find(y=>y.id===x.cid);return c?inter(x.a.jobs,p.jobs).map(j=>({x,j,a:answersOf(x,c),m:scorePro(p,j,answersOf(x,c))})):[]}).filter(o=>!o.m.out.length).sort((x,y)=>y.m.pts-x.m.pts);

const rankNow=(db,p,x,j)=>{const c=db.clients.find(y=>y.id===x.cid);if(!c||!p.ok||!p.open||!p.jobs.includes(j))return null;const l=rankAll({...db,pros:db.pros.map(q=>q.id===p.id?p:q)},j,answersOf(x,c)).filter(m=>!m.out.length).sort((m,n)=>n.pts-m.pts),i=l.findIndex(m=>m.p.id===p.id);return i<0?null:{rank:i+1,of:l.length,me:l[i],best:l[0]}};

 const sec={};pos.forEach(o=>arr(o.a.sector).forEach(x=>{sec[x]=(sec[x]||0)+1}));
 Object.entries(sec).sort((m,n)=>n[1]-m[1]).filter(([x])=>!p.sector.includes(x)).slice(0,2).forEach(([x])=>best.push(['Accompagner le secteur '+x,{sector:[...p.sector,x]}]));

}

function Live({steps,a,n}){

 :html`<aside aria-label="Vos réponses" className="hidden lg:grid lg:sticky lg:top-28 rounded-[52px] p-7 min-h-[520px] content-between gap-8" style=${{background:'linear-gradient(90deg,#b7a9ff,#ff9a6b 14%,#ff7a45 34%)'}}><div className="grid gap-4">${chips}</div><div className="rounded-[28px] bg-white/85 text-black p-6 grid gap-4"><p className="serif2 text-4xl">${Math.round((n+1)/steps.length*100)} %</p>${rows}</div></aside>`;

function Wizard({steps,a,setA,onDone,onExit,last='Voir les résultats',top,embed}){
 const [i,setI]=useState(0),[e,setE]=useState(''),h=useRef(),first=useRef(true);
 const n=Math.min(i,steps.length-1),s=steps[n];
 useEffect(()=>{if(first.current){first.current=false;return}h.current?.focus({preventScroll:true});scrollTo(0,0)},[n]);
 const valid=x=>{if(s.type==='form')return s.f.map(f=>f.v&&f.v(x[f.k])).find(Boolean)||'';return filled(x[s.k])?'':'Choisissez au moins une réponse.'};
 const okStep=q=>q.type==='form'?!q.f.some(f=>f.v&&f.v(a[f.k])):filled(a[q.k]),src=a.pre&&(s.type==='form'?s.f.map(f=>a.pre[f.k]).find(Boolean):a.pre[s.k]),left=a.pre?steps.findIndex(q=>!okStep(q)):-1;
 const next=x=>{const m=valid(x);if(m)return setE(m);setE('');n===steps.length-1?onDone(x):setI(n+1)};
 const change=(k,v,auto)=>{const x=k==='*'?{...a,...v}:{...a,[k]:v};if(/^s_/.test(k)){const t='t_'+k.slice(2);x[t]=arr(x[t]).filter(y=>v.includes(y))}if(x.pre&&k!=='*'){x.pre={...x.pre};delete x.pre[k];if(k==='jobs')last==='Terminer mon profil'?fillSkills(x):fillNeeds(x)}setA(x);setE('');if(auto&&n<steps.length-1)setTimeout(()=>setI(n+1),120)};
 return html`<div className="bg-mist min-h-[70vh]"><div className=${(embed?'':'gut !max-w-[1300px] py-8 sm:py-14 ')+'grid lg:grid-cols-[minmax(0,1.7fr)_minmax(280px,1fr)] gap-12 items-start'}><div className="grid gap-7 min-w-0">${n===0&&top}
 <div className="wprog grid gap-2"><div className="flex justify-between text-sm text-slate-600"><span>Étape ${n+1} sur ${steps.length}</span><button type="button" onClick=${onExit} className="font-semibold hover:text-brand">Quitter</button></div><div className="h-2 rounded-full bg-slate-200 overflow-hidden" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax=${steps.length} aria-valuenow=${n+1}><div className="h-full bg-brand fillbar transition-all" style=${{width:(n+1)/steps.length*100+'%'}}></div></div></div>
 <form key=${s.k} data-step className="step grid gap-6" onSubmit=${ev=>{ev.preventDefault();next(a)}}><div className="grid gap-2">${s.tag&&html`<p className="flex gap-2 items-center font-semibold text-brand"><${Ic} n=${JOBS[s.tag].i}/>${JOBS[s.tag].t}</p>`}<h1 ref=${h} tabIndex="-1" className="text-[2rem] sm:text-5xl leading-[1.06]">${s.q}</h1>${src&&html`<p data-src className="inline-flex gap-2 items-center justify-self-start rounded-full px-4 py-2 font-medium" style=${{background:src===REG?'#d9f2e1':'#ffe3d3'}}><${Ic} n=${src===REG?'BadgeCheck':'Sparkles'} size=${18}/>Prérempli · ${src}</p>`}<p className="text-slate-600">${s.help||(s.type==='multi'?(s.max?`Jusqu'à ${s.max} réponses.`:'Plusieurs réponses possibles.'):'')}</p></div>
 ${s.type==='form'?html`<div className="grid gap-4 max-w-xl">${s.f.map(f=>html`<${AnyField} key=${f.k} f=${f} a=${a} put=${change} pre="f-"/>`)}</div>`:html`<${Choices} s=${s} v=${a[s.k]} set=${(v,auto)=>change(s.k,v,auto)}/>`}
 <${Err} e=${e}/><div className="wact flex flex-wrap items-center gap-5">${n>0&&html`<button type="button" className=${quiet} onClick=${()=>{setE('');setI(n-1)}}><${Ic} n="ArrowLeft" size=${18}/>Retour</button>`}<button data-next className=${primary}>${n===steps.length-1?last:src?'C\'est bon, suivant':'Continuer'}</button>${a.pre&&n<steps.length-1&&html`<button type="button" data-all className=${ghost} onClick=${()=>{setE('');left<0?onDone(a):setI(left)}}>${left<0?'Tout est bon, terminer':left===n?'Cette réponse est à choisir':'Aller à la réponse manquante'}</button>`}</div></form></div><${Live} steps=${steps} a=${a} n=${n}/></div></div>`;
}

 ${[ClientSpace,ProSpace,AdminSpace,Account].includes(P)?null:html`<${HomeHead} d=${dz()} u=${u}/>`}${el}</div>`;
}

const ps=positions(d,d.pros[0]),p0=ps.find(o=>o.x.id==='s1');

d.threads[0].closed=true;sendMsg(d,'ahmed','alma','pro','x');console.assert(d.threads[0].msgs.length===1,'conversation bloquée');

const lo={...a,n_ec:[JOBS.ec.sk[0]]};console.assert(scorePro(d.pros[0],'ec',a).pts>scorePro(d.pros[0],'ec',lo).pts,'un point fort vaut plus qu\'une offre simple');
